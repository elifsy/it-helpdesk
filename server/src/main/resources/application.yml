server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: it-helpdesk
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/it_helpdesk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tzme.helpdesk.domain
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    default-fetch-size: 100

helpdesk:
  # 本地没有 Redis 时设为 false，自动降级（单号用时间戳 / 看板不缓存 / 定时任务不加锁）
  redis-enabled: ${REDIS_ENABLED:true}
  jwt:
    # 生产环境务必通过环境变量覆盖，长度不低于 32 字节
    secret: ${JWT_SECRET:tzme-helpdesk-change-this-secret-in-production-2026}
    expire-hours: 12
  dingtalk:
    # 本地/演示默认关闭，关闭时使用 X-Demo-User 头或默认演示账号
    enabled: ${DINGTALK_ENABLED:false}
    corp-id: ${DINGTALK_CORP_ID:}
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    agent-id: ${DINGTALK_AGENT_ID:}
    bootstrap-admin-user-id: ${DINGTALK_BOOTSTRAP_ADMIN_USER_ID:}
    token-url: https://oapi.dingtalk.com/gettoken
    user-info-url: https://oapi.dingtalk.com/topapi/v2/user/getuserinfo
    user-detail-url: https://oapi.dingtalk.com/topapi/v2/user/get
    work-notify-url: https://oapi.dingtalk.com/topapi/message/corpconversation/asyncsend_v2
    # 每天 02:00 同步通讯录（仅 DINGTALK_ENABLED=true 时执行）
    sync-cron: ${DINGTALK_SYNC_CRON:0 0 2 * * ?}
  sla:
    # 演示版按自然小时；正式版应替换为工作日历 + 挂起停表
    p1-hours: 4
    p2-hours: 8
    p3-hours: 16
    p4-hours: 40
  qrcode:
    # 二维码内容 = base-url + "/#/assets?asset=" + URL 编码后的资产编号
    base-url: ${QRCODE_BASE_URL:http://localhost:5173}
  upload:
    # 附件落盘目录；生产建议挂载独立数据盘
    dir: ${UPLOAD_DIR:./data/uploads}
  demo-user: ${DEMO_USER:张伟}

logging:
  level:
    com.tzme.helpdesk: info
    org.springframework.web: warn
