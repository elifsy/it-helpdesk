user www-data;
worker_processes auto;
pid /opt/ams/run/nginx.pid;
error_log /opt/ams/logs/frontend-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /opt/ams/logs/frontend-access.log;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_body_temp_path /opt/ams/run/client_body;
    proxy_temp_path /opt/ams/run/proxy_temp;

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 80;
        server_name ams.tzme.net;
        root /opt/ams/current/web;
        client_max_body_size 20m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag 'noindex, nofollow' always;

        location ^~ /.well-known/acme-challenge/ {
            root /opt/ams/acme;
            try_files $uri =404;
        }
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:18081/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Demo-User '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location = / { try_files /index.html =404; add_header Cache-Control 'no-store'; }
        location = /index.html { try_files $uri =404; add_header Cache-Control 'no-store'; }
        location ^~ /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=86400, immutable'; }
        location / { return 404; }
    }
}
